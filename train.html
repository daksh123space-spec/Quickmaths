<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Train | QuickMaths</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --accent: #7c3aed;
            --bg: #020205;
            --border: rgba(255, 255, 255, .08);
            --text2: rgba(255, 255, 255, .5)
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overflow: hidden
        }

        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none
        }

        .n1 {
            position: absolute;
            width: 700px;
            height: 700px;
            border-radius: 50%;
            background: radial-gradient(circle, #3b0086, transparent);
            filter: blur(100px);
            opacity: .2;
            top: -200px;
            right: -100px
        }

        .n2 {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, #063b6e, transparent);
            filter: blur(100px);
            opacity: .2;
            bottom: -100px;
            left: -100px
        }

        .wrap {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 720px
        }

        .page {
            animation: fadeUp .5s ease
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        /* --- CLASSIC --- */
        .timer-circle {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: conic-gradient(#7c3aed var(--prog, 0%), rgba(255, 255, 255, .06) 0);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            position: relative
        }

        .timer-circle::before {
            content: '';
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            background: var(--bg)
        }

        .timer-num {
            position: relative;
            z-index: 1;
            font-size: 2.2rem;
            font-weight: 800;
            color: #fff
        }

        .q-card {
            background: rgba(10, 10, 26, .7);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 2.5rem;
            text-align: center;
            margin-bottom: 1.5rem
        }

        .q-card h2 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1.75rem;
            letter-spacing: -1px
        }

        #train-input {
            width: 100%;
            max-width: 250px;
            padding: 1rem 1.25rem;
            background: rgba(255, 255, 255, .04);
            border: 2px solid rgba(255, 255, 255, .1);
            border-radius: 16px;
            font-size: 1.6rem;
            color: #fff;
            text-align: center;
            outline: none;
            font-family: 'Inter', sans-serif
        }

        #train-input:focus {
            border-color: var(--accent)
        }

        #train-input.correct {
            border-color: #10b981
        }

        #train-input.wrong {
            border-color: #ef4444;
            animation: shake .4s
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0)
            }

            25% {
                transform: translateX(-6px)
            }

            75% {
                transform: translateX(6px)
            }
        }

        .stats-bar {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-bottom: 2rem
        }

        .s-pill {
            display: flex;
            align-items: center;
            gap: .5rem;
            background: rgba(255, 255, 255, .05);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: .4rem 1rem;
            font-size: .85rem;
            font-weight: 600
        }

        /* MODE header */
        .mode-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.75rem
        }

        .mode-badge {
            font-size: .75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text2);
            background: rgba(255, 255, 255, .04);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: .3rem .85rem
        }

        .exit-btn {
            background: none;
            border: none;
            color: var(--text2);
            font-size: .85rem;
            cursor: pointer;
            transition: color .2s
        }

        .exit-btn:hover {
            color: #fff
        }

        /* Results */
        .res-card {
            background: rgba(10, 10, 26, .7);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 3rem;
            text-align: center;
            width: 100%
        }

        .res-card h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 2rem
        }

        .grid2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem
        }

        .sbox {
            background: rgba(255, 255, 255, .04);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 1.5rem
        }

        .sbox label {
            display: block;
            font-size: .72rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text2);
            margin-bottom: .5rem
        }

        .sbox .v {
            font-size: 2rem;
            font-weight: 700
        }

        .btn-row {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap
        }

        .btn-primary {
            padding: .85rem 2rem;
            background: linear-gradient(135deg, #7c3aed, #3b82f6);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: .95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all .25s;
            text-decoration: none;
            display: inline-block
        }

        .btn-primary:hover {
            transform: translateY(-2px)
        }

        .btn-sec {
            padding: .85rem 1.5rem;
            background: rgba(255, 255, 255, .05);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: rgba(255, 255, 255, .7);
            font-size: .95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .25s;
            text-decoration: none;
            display: inline-block
        }

        /* SURVIVAL */
        .survival-arena {
            position: relative;
            width: 100%;
            height: 380px;
            background: rgba(10, 10, 26, .6);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 1.5rem
        }

        .falling-q {
            position: absolute;
            background: rgba(124, 58, 237, .2);
            border: 1px solid rgba(124, 58, 237, .4);
            border-radius: 12px;
            padding: .6rem 1.2rem;
            font-size: 1.15rem;
            font-weight: 700;
            white-space: nowrap;
            animation: fall linear forwards
        }

        @keyframes fall {
            from {
                top: -60px
            }

            to {
                top: 100%
            }
        }

        .ground {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #7c3aed, #3b82f6);
            opacity: .3;
            border-radius: 3px
        }

        .surv-input {
            width: 100%;
            padding: 1rem 1.25rem;
            background: rgba(255, 255, 255, .04);
            border: 2px solid rgba(255, 255, 255, .1);
            border-radius: 16px;
            font-size: 1.4rem;
            color: #fff;
            text-align: center;
            outline: none
        }

        .surv-input:focus {
            border-color: #7c3aed
        }
    </style>
</head>

<body>
    <div class="bg">
        <div class="n1"></div>
        <div class="n2"></div>
    </div>
    <div class="wrap">

        <!-- CLASSIC MODE -->
        <div id="classic-page" class="page" style="display:none">
            <div class="mode-header">
                <div class="mode-badge">⏱️ Classic Mode</div>
                <button class="exit-btn" onclick="exitTrain()">✕ Exit</button>
            </div>
            <div class="timer-circle" id="classic-circle">
                <div class="timer-num" id="classic-timer">2:00</div>
            </div>
            <div class="stats-bar">
                <div class="s-pill">✓ <span id="c-correct">0</span></div>
                <div class="s-pill">✗ <span id="c-wrong">0</span></div>
                <div class="s-pill">⚡ <span id="c-qnum">0</span> answered</div>
            </div>
            <div class="q-card">
                <h2 id="c-question">…</h2>
                <input type="text" id="train-input" placeholder="?" autocomplete="off">
            </div>
            <p style="text-align:center;color:var(--text2);font-size:.82rem">Press Enter to submit</p>
        </div>

        <!-- ENDLESS MODE -->
        <div id="endless-page" class="page" style="display:none">
            <div class="mode-header">
                <div class="mode-badge">♾️ Endless Mode</div>
                <button class="exit-btn" onclick="exitTrain()">✕ Exit</button>
            </div>
            <div class="stats-bar">
                <div class="s-pill">🔥 Streak: <span id="e-streak">0</span></div>
                <div class="s-pill">✓ <span id="e-correct">0</span></div>
            </div>
            <div class="q-card">
                <h2 id="e-question">…</h2>
                <input type="text" id="endless-input" placeholder="?" autocomplete="off">
            </div>
        </div>

        <!-- SURVIVAL MODE -->
        <div id="survival-page" class="page" style="display:none">
            <div class="mode-header">
                <div class="mode-badge">🎯 Survival Mode</div>
                <div class="s-pill">✓ <span id="surv-score">0</span></div>
                <button class="exit-btn" onclick="exitTrain()">✕ Exit</button>
            </div>
            <div class="survival-arena" id="arena">
                <div class="ground"></div>
            </div>
            <input type="text" class="surv-input" id="surv-input" placeholder="Type your answer and press Enter…"
                autocomplete="off">
        </div>

        <!-- RESULTS -->
        <div id="results-page" class="page" style="display:none">
            <div class="res-card">
                <h1 id="res-title">Nice Work!</h1>
                <div class="grid2" id="res-grid"></div>
                <div class="btn-row">
                    <button class="btn-primary" onclick="restart()">Play Again</button>
                    <a href="dashboard.html" class="btn-sec">Dashboard</a>
                </div>
            </div>
        </div>

    </div><!-- .wrap -->

    <script src="data.js"></script>
    <script>
        const mode = sessionStorage.getItem('qm_train_mode') || 'classic';
        let cCorrect = 0, cWrong = 0, cTotal = 0, eTotalTime = 0, eStart = 0, survScore = 0;
        let currentQ = null;
        let classicInterval = null, classicSecs = 120;

        function newQ() { return QGen.mixed(); }

        // ============ CLASSIC ============
        function startClassic() {
            document.getElementById('classic-page').style.display = 'block';
            nextClassicQ();
            const circle = document.getElementById('classic-circle');
            classicInterval = setInterval(() => {
                classicSecs--;
                const m = Math.floor(classicSecs / 60), s = classicSecs % 60;
                document.getElementById('classic-timer').textContent = `${m}:${s.toString().padStart(2, '0')}`;
                const pct = (classicSecs / 120) * 360;
                circle.style.setProperty('--prog', pct + 'deg');
                if (classicSecs <= 0) { clearInterval(classicInterval); showClassicResults(); }
            }, 1000);

            document.getElementById('train-input').addEventListener('keyup', (e) => {
                if (e.key !== 'Enter') return;
                const v = parseFloat(e.target.value.trim());
                if (isNaN(v)) return;
                const correct = Math.abs(v - currentQ.a) < 0.05;
                if (correct) { cCorrect++; e.target.className = 'correct'; }
                else { cWrong++; e.target.className = 'wrong'; }
                cTotal++;
                document.getElementById('c-correct').textContent = cCorrect;
                document.getElementById('c-wrong').textContent = cWrong;
                document.getElementById('c-qnum').textContent = cTotal;
                setTimeout(nextClassicQ, 250);
            });
        }

        function nextClassicQ() {
            currentQ = newQ();
            document.getElementById('c-question').textContent = currentQ.q;
            const inp = document.getElementById('train-input');
            inp.value = ''; inp.className = ''; inp.focus();
        }

        function showClassicResults() {
            const xp = cCorrect;
            if (xp > 0) QM.addXP(xp);
            document.getElementById('classic-page').style.display = 'none';
            showResults('Classic Complete ⏱️', [
                ['Correct', cCorrect], ['Wrong', cWrong],
                ['Answered', cTotal], ['+XP', xp]
            ]);
        }

        // ============ ENDLESS ============
        function startEndless() {
            document.getElementById('endless-page').style.display = 'block';
            nextEndlessQ();
            document.getElementById('endless-input').addEventListener('keyup', (e) => {
                if (e.key !== 'Enter') return;
                const v = parseFloat(e.target.value.trim());
                if (isNaN(v)) return;
                const correct = Math.abs(v - currentQ.a) < 0.05;
                if (correct) {
                    cCorrect++;
                    document.getElementById('e-correct').textContent = cCorrect;
                    document.getElementById('e-streak').textContent = cCorrect;
                    e.target.className = 'correct';
                    setTimeout(nextEndlessQ, 250);
                } else {
                    e.target.className = 'wrong';
                    setTimeout(() => {
                        document.getElementById('endless-page').style.display = 'none';
                        showResults('Game Over ♾️', [
                            ['Correct', cCorrect], ['Streak', cCorrect]
                        ]);
                    }, 600);
                }
            });
        }

        function nextEndlessQ() {
            currentQ = newQ();
            document.getElementById('e-question').textContent = currentQ.q;
            const inp = document.getElementById('endless-input');
            inp.value = ''; inp.className = ''; inp.focus();
        }

        // ============ SURVIVAL ============
        let survItems = [];
        let survInterval = null;
        let survSpeed = 8000; // ms to fall
        let survActive = true;

        function startSurvival() {
            document.getElementById('survival-page').style.display = 'block';
            spawnFalling();
            survInterval = setInterval(() => {
                if (!survActive) return;
                spawnFalling();
                survSpeed = Math.max(3000, survSpeed - 100); // speed up
            }, 3000);

            document.getElementById('surv-input').addEventListener('keyup', (e) => {
                if (e.key !== 'Enter' || !survActive) return;
                const v = parseFloat(e.target.value.trim());
                e.target.value = '';
                if (isNaN(v)) return;
                // Find first matching question
                const idx = survItems.findIndex(i => Math.abs(v - i.q.a) < 0.05);
                if (idx !== -1) {
                    survItems[idx].el.remove();
                    survItems.splice(idx, 1);
                    survScore++;
                    document.getElementById('surv-score').textContent = survScore;
                    e.target.className = ''; e.target.style.borderColor = '#10b981';
                    setTimeout(() => e.target.style.borderColor = '', 400);
                }
            });
        }

        function spawnFalling() {
            const q = newQ();
            const el = document.createElement('div');
            el.className = 'falling-q';
            el.textContent = q.q;
            const arena = document.getElementById('arena');
            el.style.left = Math.random() * 70 + '%';
            el.style.animationDuration = survSpeed + 'ms';
            arena.appendChild(el);
            const item = { q, el };
            survItems.push(item);

            el.addEventListener('animationend', () => {
                if (!survActive) return;
                // Question hit ground
                survActive = false;
                clearInterval(survInterval);
                el.remove();
                const xp = Math.floor(survScore / 3);
                if (xp > 0) QM.addXP(xp);
                document.getElementById('survival-page').style.display = 'none';
                showResults('Game Over 🎯', [
                    ['Answered', survScore], ['+XP', xp]
                ]);
            });
        }

        // ============ SHARED RESULTS ============
        function showResults(title, stats) {
            document.getElementById('results-page').style.display = 'block';
            document.getElementById('res-title').textContent = title;
            const grid = document.getElementById('res-grid');
            grid.innerHTML = '';
            stats.forEach(([label, val]) => {
                const b = document.createElement('div');
                b.className = 'sbox';
                b.innerHTML = `<label>${label}</label><div class="v">${val}</div>`;
                grid.appendChild(b);
            });
        }

        function restart() {
            sessionStorage.setItem('qm_train_mode', mode);
            window.location.reload();
        }

        function exitTrain() {
            clearInterval(classicInterval);
            clearInterval(survInterval);
            window.location.href = 'dashboard.html';
        }

        // INIT
        if (mode === 'classic') startClassic();
        else if (mode === 'endless') startEndless();
        else if (mode === 'survival') startSurvival();
    </script>
</body>

</html>
