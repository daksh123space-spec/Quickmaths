<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Learn | QuickMaths</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --accent: #7c3aed;
            --bg: #020205;
            --card: rgba(255, 255, 255, .04);
            --border: rgba(255, 255, 255, .08);
            --text2: rgba(255, 255, 255, .5)
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            background: var(--bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh
        }

        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none
        }

        .n1 {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, #3b0086, transparent);
            filter: blur(100px);
            opacity: .2;
            top: -200px;
            right: -100px
        }

        /* TOP NAV */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: .9rem 2rem;
            background: rgba(2, 2, 5, .8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border)
        }

        .back-link {
            color: var(--text2);
            text-decoration: none;
            font-size: .88rem;
            display: flex;
            align-items: center;
            gap: .5rem;
            transition: color .2s
        }

        .back-link:hover {
            color: #fff
        }

        .progress-bar {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, .1);
            border-radius: 100px;
            margin: 0 2rem;
            overflow: hidden
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #3b82f6);
            border-radius: 100px;
            transition: width .3s ease
        }

        .xp-pill {
            display: flex;
            align-items: center;
            gap: .4rem;
            font-size: .82rem;
            font-weight: 600;
            color: #f59e0b;
            background: rgba(245, 158, 11, .08);
            border: 1px solid rgba(245, 158, 11, .15);
            border-radius: 100px;
            padding: .35rem .85rem
        }

        /* CONTENT */
        .content-wrap {
            max-width: 760px;
            margin: 0 auto;
            padding: 3rem 2rem 6rem;
            position: relative;
            z-index: 5
        }

        .section-badge {
            display: inline-block;
            background: rgba(124, 58, 237, .15);
            border: 1px solid rgba(124, 58, 237, .25);
            color: #a78bfa;
            font-size: .8rem;
            font-weight: 600;
            padding: .3rem .85rem;
            border-radius: 100px;
            margin-bottom: 1.5rem;
            letter-spacing: .5px
        }

        .lesson-content h2 {
            font-size: 2rem;
            font-weight: 700;
            margin: 1.5rem 0 .75rem;
            line-height: 1.2
        }

        .lesson-content h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 2rem 0 .75rem;
            color: #a78bfa
        }

        .lesson-content p {
            color: rgba(255, 255, 255, .75);
            line-height: 1.8;
            margin-bottom: 1.25rem;
            font-size: 1rem
        }

        .lesson-content ul,
        .lesson-content ol {
            color: rgba(255, 255, 255, .75);
            line-height: 1.9;
            margin: 0 0 1.25rem 1.5rem;
            font-size: 1rem
        }

        .steps {
            display: flex;
            flex-direction: column;
            gap: .75rem;
            margin: 1.25rem 0 1.75rem;
            padding: 1.25rem;
            background: rgba(124, 58, 237, .06);
            border: 1px solid rgba(124, 58, 237, .15);
            border-radius: 18px
        }

        .step {
            display: flex;
            align-items: flex-start;
            gap: .85rem;
            font-size: .92rem;
            color: rgba(255, 255, 255, .8)
        }

        .step::before {
            content: counter(step-counter);
            counter-increment: step-counter;
            background: rgba(124, 58, 237, .3);
            color: #c4b5fd;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: .78rem;
            font-weight: 700
        }

        .steps {
            counter-reset: step-counter
        }

        .example {
            background: rgba(255, 255, 255, .03);
            border: 1px solid var(--border);
            border-left: 3px solid #3b82f6;
            border-radius: 14px;
            padding: 1.25rem 1.5rem;
            margin: .75rem 0 1.25rem;
            font-size: .93rem;
            line-height: 1.7;
            color: rgba(255, 255, 255, .8)
        }

        .example strong {
            color: #fff
        }

        /* BOTTOM BAR */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: flex;
            gap: 1rem;
            align-items: center;
            justify-content: flex-end;
            padding: 1rem 2rem;
            background: rgba(2, 2, 5, .9);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border)
        }

        .btn-back {
            padding: .8rem 1.5rem;
            background: rgba(255, 255, 255, .05);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: rgba(255, 255, 255, .7);
            font-size: .9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .25s
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, .08);
            color: #fff
        }

        .btn-questions {
            padding: .8rem 2rem;
            background: linear-gradient(135deg, var(--accent), #3b82f6);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: .9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all .25s
        }

        .btn-questions:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(124, 58, 237, .35)
        }

        .xp-earned {
            font-size: .85rem;
            font-weight: 600;
            color: #10b981
        }
    </style>
</head>

<body>
    <div class="bg">
        <div class="n1"></div>
    </div>

    <nav class="top-nav">
        <a href="lesson-view.html" class="back-link">← Back</a>
        <div class="progress-bar">
            <div class="progress-fill" style="width:50%"></div>
        </div>
        <div class="xp-pill">+10 XP on completion</div>
    </nav>

    <div class="content-wrap">
        <div class="section-badge" id="sec-badge">Section</div>
        <div class="lesson-content" id="lesson-content">Loading...</div>
    </div>

    <div class="bottom-bar">
        <span class="xp-earned" id="xp-earned-msg"></span>
        <button class="btn-back" onclick="history.back()">← Back</button>
        <button class="btn-questions" id="questions-btn">Questions →</button>
    </div>

    <script src="data.js"></script>
    <script>
        const user = QM.getUser();
        if (!user) { window.location.href = 'auth.html'; }

        const lesson = JSON.parse(sessionStorage.getItem('qm_lesson') || '{}');
        const { secId, lessonId } = lesson;
        const sec = CURRICULUM.find(s => s.id === secId);
        const les = sec?.lessons.find(l => l.id === lessonId);
        if (!les) { window.location.href = 'dashboard.html'; }

        document.getElementById('sec-badge').textContent = sec.title;
        document.getElementById('lesson-content').innerHTML = les.content;

        // Award read XP
        let xpAwarded = false;
        const alreadyRead = user.progress?.[secId]?.[lessonId]?.read;
        if (!alreadyRead) {
            QM.markLessonRead(secId, lessonId);
            xpAwarded = true;
            document.getElementById('xp-earned-msg').textContent = '+10 XP earned for reading! 🎉';
        } else {
            document.getElementById('xp-earned-msg').textContent = '✓ Already read';
        }

        document.getElementById('questions-btn').onclick = () => {
            sessionStorage.setItem('qm_quiz', JSON.stringify({ secId, lessonId, mode: 'lesson', count: 15 }));
            window.location.href = 'quiz.html';
        };
    </script>
</body>

</html>
