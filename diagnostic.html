<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnostic Test | QuickMaths</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap"
        rel="stylesheet">
    <style>
        body,
        html {
            min-height: 100%;
            margin: 0;
            background: #000;
        }

        .diagnostic-container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .hero-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Full page card style */
        .full-page-card {
            background: rgba(10, 10, 26, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 4rem;
            width: 100%;
            max-width: 800px;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question-box h3 {
            font-size: 3.5rem;
            margin-bottom: 2rem;
            letter-spacing: -1px;
        }

        #quiz-input {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 1.5rem 2rem;
            font-size: 2rem;
            color: white;
            width: 100%;
            max-width: 300px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        #quiz-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.2);
        }

        .timer-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 100px;
            margin-top: 2rem;
            overflow: hidden;
        }

        #timer-progress {
            height: 100%;
            width: 100%;
            background: var(--accent-color);
            transition: width 0.1s linear;
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .result-item.full-width {
            grid-column: span 2;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(139, 92, 246, 0.1));
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .rank-reveal {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            font-weight: 500;
        }

        .rank-reveal span {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-weight: 700;
            color: var(--accent-color);
        }

        .result-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 2rem;
            border-radius: 24px;
        }

        .result-item label {
            display: block;
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }

        .result-item span {
            font-size: 2.5rem;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <!-- Background (Copied from index.html for consistency) -->
    <div class="hero-bg">
        <div class="background-effects" style="width: 100%; height: 100%;">
            <video autoplay loop muted playsinline class="hero-video">
                <source src="grok-video-6d5eb446-9eca-4240-8c06-73ac4b481b6d.mp4" type="video/mp4">
            </video>
            <div class="starfield"></div>
            <div class="nebula-1"></div>
            <div class="nebula-2"></div>
            <div class="galaxy-arc"></div>
            <div class="horizon-glow"></div>
        </div>
    </div>

    <div class="diagnostic-container">
        <div class="full-page-card">
            <!-- Intro State -->
            <div id="quiz-intro">
                <div class="badge" style="margin-bottom: 2rem;">Challenge Mode</div>
                <h1 style="font-size: 3.5rem; margin-bottom: 1.5rem;">Diagnostic Test</h1>
                <p class="subtitle" style="margin: 0 auto 3rem;">15 progressive questions covering fractions, decimals,
                    and logic. Your speed and accuracy will determine your rank.</p>
                <button class="btn-primary large" id="begin-quiz">Start Diagnostic Test</button>
                <div style="margin-top: 2rem;">
                    <a href="index.html"
                        style="color: var(--text-secondary); text-decoration: none; font-size: 0.9rem;">← Back to
                        Home</a>
                </div>
            </div>

            <!-- Active Quiz State -->
            <div id="quiz-active" style="display: none;">
                <div class="quiz-header" style="margin-bottom: 3rem;">
                    <div id="question-count"
                        style="font-size: 0.9rem; color: var(--text-secondary); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 1rem;">
                        Question 1 / 15</div>
                    <div class="timer-bar">
                        <div id="timer-progress"></div>
                    </div>
                </div>
                <div class="question-box">
                    <h3 id="question-text">Loading...</h3>
                    <input type="text" id="quiz-input" placeholder="?" autocomplete="off">
                </div>
                <p style="margin-top: 2rem; color: var(--text-secondary); font-size: 0.8rem;">Press Enter to submit</p>
            </div>

            <!-- Results State -->
            <div id="quiz-results" style="display: none;">
                <div class="badge" style="margin-bottom: 1rem;">Test Complete</div>
                <h1 style="margin-bottom: 1rem;">Your Performance</h1>
                <div class="rank-badge" id="rank-badge" style="margin-bottom: 2rem;">Beginner</div>

                <div class="results-grid">
                    <div class="result-item">
                        <label>Accuracy</label>
                        <span id="stat-accuracy">0%</span>
                    </div>
                    <div class="result-item">
                        <label>Avg Speed</label>
                        <span id="stat-speed">0s</span>
                    </div>
                    <div class="result-item full-width">
                        <label>Final Score</label>
                        <span id="final-score" style="font-size: 4rem;">0</span>
                    </div>
                </div>

                <div class="rank-reveal">
                    You are <span id="rank-text">...</span>
                </div>

                <div style="display: flex; gap: 1rem; justify-content: center;">
                    <a href="dashboard.html" class="btn-primary large"
                        style="text-decoration: none; padding: 1.2rem 4rem;">Start →</a>
                </div>
            </div>
        </div>
    </div>

    <script src="diagnostic.js"></script>
</body>

</html>
